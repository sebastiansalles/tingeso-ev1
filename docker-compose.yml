# SIGA IPT: deployment with Docker Compose.
# Every value that changes between environments or is secret comes from the .env file (see .env.example).
#
#   browser ──► frontend  (port 80)
#           ──► nginx     (port 8080) ──► backend-1 / backend-2 / backend-3 ──► mysql
#           ──► keycloak  (port 9090)            └── validate tokens and create accounts ──► keycloak

services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: siga
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql          # the data survives if the container is removed or recreated
    healthcheck:                           # "healthy" only when MySQL accepts TCP connections
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Public URL of Keycloak: it is written as "iss" in every token
      KC_HOSTNAME: http://${PUBLIC_HOST}:9090
      # Used by siga-realm.json when it is imported
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      FRONTEND_URL: http://${PUBLIC_HOST}
      SIGA_ADMIN_PASSWORD: ${SIGA_ADMIN_PASSWORD}
    ports:
      - "9090:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data   # users created by the app survive restarts
      - ./keycloak/siga-realm.json:/opt/keycloak/data/import/siga-realm.json:ro

  # Three replicas of the backend, identical. Only Nginx reaches them (no published ports)
  backend-1:
    image: ${DOCKERHUB_USERNAME}/siga-backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # The "iss" claim of the tokens: the URL the BROWSER uses to reach Keycloak
      KEYCLOAK_ISSUER_URI: http://${PUBLIC_HOST}:9090/realms/siga
      # The public keys and the Admin API: reached INSIDE the Docker network
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/siga/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      FRONTEND_URL: http://${PUBLIC_HOST}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend-2:
    image: ${DOCKERHUB_USERNAME}/siga-backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://${PUBLIC_HOST}:9090/realms/siga
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/siga/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      FRONTEND_URL: http://${PUBLIC_HOST}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend-3:
    image: ${DOCKERHUB_USERNAME}/siga-backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://${PUBLIC_HOST}:9090/realms/siga
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/siga/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      FRONTEND_URL: http://${PUBLIC_HOST}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  frontend:
    image: ${DOCKERHUB_USERNAME}/siga-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - nginx
      - keycloak

volumes:
  mysql-data:
  keycloak-data:
