server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: paths like /students or /my-plan are not real files. Nginx returns index.html
    # and the router resolves the page in the browser (otherwise refreshing the page gives a 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}