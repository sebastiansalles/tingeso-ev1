# Load balancer: distributes the requests among the three backend replicas.
# By default Nginx uses round-robin: 1st request to backend-1, 2nd to backend-2, 3rd to backend-3, ...
upstream backend {
    server backend-1:8080;
    server backend-2:8080;
    server backend-3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;

        # Pass the original request data to the backend (the client is the browser, not Nginx)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
