# Profile used by the integration tests (@ActiveProfiles("test")).
# In-memory H2 database: no MySQL needed, so the tests also run in the CI pipeline.
#  - MODE=MySQL        -> behaves like MySQL
#  - NON_KEYWORDS      -> "year" and "day" are reserved words in H2; this allows them as column names
spring.datasource.url=jdbc:h2:mem:siga_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,DAY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tables are created from the entities and dropped at the end
spring.jpa.hibernate.ddl-auto=create-drop

# data.sql (Appendix A) is not loaded: each test creates exactly the data it needs
spring.sql.init.mode=never
