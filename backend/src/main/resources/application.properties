spring.application.name=siga-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/siga
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8


# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/siga}
# Public keys to verify the token signature. In Docker they are downloaded from inside the network
# (keycloak:8080), while issuer-uri keeps the public URL that appears in the "iss" claim of the tokens
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:9090/realms/siga/protocol/openid-connect/certs}

# Keycloak Admin API: the backend creates the accounts of new students and teachers
keycloak.admin.server-url=${KEYCLOAK_URL:http://localhost:9090}
keycloak.admin.realm=siga
keycloak.admin.client-id=siga-backend
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
# react front
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


spring.jpa.open-in-view=false